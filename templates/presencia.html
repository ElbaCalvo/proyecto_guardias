<!DOCTYPE html>
<html>
<head>
    <title>Control de presencia</title>
</head>

<body>

<h1>Control de presencia</h1>

{% for p in profesores %}
<form method="POST" action="/toggle_presencia">
    <input type="hidden" name="profesor_id" value="{{ p[0] }}"><br>
    <button type="submit">
        {{ p[1] }} - 
        {% if p[2] == 1 %}
            <b style="color: green;">PRESENTE</b>
        {% else %}
            <b style="color: red;">AUSENTE</b>
        {% endif %}
    </button>
</form>
{% endfor %}

<br>
<a href="/">Volver</a>

</body>
</html>
